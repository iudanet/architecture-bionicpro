x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-webserver-secret
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONN_CRM_DB: postgres://crm_reader:crm_reader_pw@sources-db:5432/crm
    AIRFLOW_CONN_TELEMETRY_DB: postgres://telemetry_reader:telemetry_reader_pw@sources-db:5432/telemetry
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_USER: etl_writer
    CLICKHOUSE_PASSWORD: etl_writer_pw
    # Для демонстрации витрина обновляется каждые 5 минут; по умолчанию в DAG — @hourly.
    REPORTS_ETL_SCHEDULE: "*/5 * * * *"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # ---------- SSO ----------
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      # Публичный адрес: issuer токенов одинаковый и для браузера, и для backchannel-запросов BFF/API.
      KC_HOSTNAME_URL: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HEALTH_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy

  bff:
    build:
      context: ./backend
      args:
        SERVICE: bff
    environment:
      OIDC_PUBLIC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/reports-realm
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/reports-realm
      OIDC_CLIENT_ID: reports-bff
      OIDC_CLIENT_SECRET: bff-dev-secret-change-me
      OIDC_REDIRECT_URL: http://localhost:3000/bff/auth/callback
      OIDC_API_AUDIENCE: reports-api
      FRONTEND_URL: http://localhost:3000/
      REPORTS_API_URL: http://reports-api:8001
      # Локальный стенд работает по HTTP; в проде cookie только Secure.
      COOKIE_SECURE: "false"
    depends_on:
      - keycloak
      - reports-api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - bff

  # ---------- Сервис отчётов ----------
  reports-api:
    build:
      context: ./backend
      args:
        SERVICE: reports
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/reports-realm
      OIDC_JWKS_URL: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      OIDC_AUDIENCE: reports-api
      REQUIRED_ROLE: prothetic_user
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_USER: reports_reader
      CLICKHOUSE_PASSWORD: reports_reader_pw
    depends_on:
      clickhouse:
        condition: service_healthy

  # ---------- Источники данных (OLTP) ----------
  sources-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sources_admin
      POSTGRES_PASSWORD: sources_admin_pw
      POSTGRES_DB: postgres
    volumes:
      - ./sources/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sources_admin -d telemetry"]
      interval: 5s
      retries: 20

  telemetry-simulator:
    image: postgres:16-alpine
    environment:
      PGHOST: sources-db
      PGDATABASE: telemetry
      PGUSER: telemetry_writer
      PGPASSWORD: telemetry_writer_pw
      TELEMETRY_INTERVAL: "10"
    volumes:
      - ./sources/simulate_telemetry.sh:/simulate_telemetry.sh:ro
    entrypoint: ["/bin/sh", "/simulate_telemetry.sh"]
    depends_on:
      sources-db:
        condition: service_healthy

  # ---------- OLAP ----------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin_pw
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      retries: 30

  # ---------- ETL ----------
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin
        --lastname BionicPRO --role Admin --email admin@bionicpro.local
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      sources-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
